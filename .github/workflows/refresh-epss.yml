name: Refresh EPSS data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh published EPSS fields
        run: python scripts/refresh_epss.py --data-dir data
      - name: Run regression tests
        run: |
          node tests/engine.test.mjs
          node tests/september_record.test.mjs
          node tests/ui_performance.test.mjs
          node scripts/audit-mitigations.mjs
          python tests/test_enrich_cvrf.py
          python tests/test_merge_inference.py
          python tests/test_refresh_epss.py
      - name: Build static site
        run: node scripts/build-pages.mjs
      - name: Commit changed scores
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No EPSS changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh EPSS scores"
          git push
